# Keep workspace file protections and allow GitHub and build dependency requests.
default_permissions = "github-workspace"

[features]
network_proxy = true

[permissions.github-workspace]
extends = ":workspace"

[permissions.github-workspace.network]
enabled = true

[permissions.github-workspace.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"
"valheim.hexium.gg" = "allow"

# GitHub raw files, source archives, and release downloads.
"raw.githubusercontent.com" = "allow"
"codeload.github.com" = "allow"
"release-assets.githubusercontent.com" = "allow"

# NuGet packages for builds and tests.
"api.nuget.org" = "allow"

# Pinned BepInEx and Jotunn dependencies, including download redirects.
"thunderstore.io" = "allow"
"ccdn.thunderstore.io" = "allow"
